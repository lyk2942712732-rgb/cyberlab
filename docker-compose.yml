name: cyberlab

x-app: &app
  build: ./backend
  image: cyberlab/backend:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cyberlab}:${POSTGRES_PASSWORD:?Generate .env first}@postgres:5432/${POSTGRES_DB:-cyberlab}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?Generate .env first}
    ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:?Generate .env first}
    ORCHESTRATOR_URL: ws://orchestrator:8081
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    UPLOAD_DIR: /var/lib/cyberlab/uploads/target-images
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
    MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-20}
    KALI_IMAGE: ${KALI_IMAGE:-cyberlab/kali:local}
    KALI_CPU: ${KALI_CPU:-2}
    KALI_MEMORY_MB: ${KALI_MEMORY_MB:-2048}
    HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-90}
    WARM_KALI_POOL: ${WARM_KALI_POOL:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberlab}
      POSTGRES_DB: ${POSTGRES_DB:-cyberlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database-net]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    networks: [database-net]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 10s
      retries: 10

  migrate:
    <<: *app
    restart: 'no'
    command: [alembic, upgrade, head]
    networks: [database-net]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    <<: *app
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate .env first}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:?Generate .env first}
    volumes:
      - ${CYBERLAB_DATA_DIR:-/var/lib/cyberlab}/uploads/target-images:/var/lib/cyberlab/uploads/target-images
    networks: [platform-net, database-net, lab-control-net]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 10

  orchestrator:
    <<: *app
    user: '0:0'
    environment:
      <<: *app-env
      ACTIVITY_HOST_DIR: ${CYBERLAB_DATA_DIR:-/var/lib/cyberlab}/activity
    command: [uvicorn, app.orchestrator.server:app, --host, 0.0.0.0, --port, '8081', --ws-max-size, '16777216']
    volumes:
      - ${CYBERLAB_DATA_DIR:-/var/lib/cyberlab}/uploads/target-images:/var/lib/cyberlab/uploads/target-images
      - ${CYBERLAB_DATA_DIR:-/var/lib/cyberlab}/activity:/var/lib/cyberlab/activity
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [database-net, lab-control-net]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [platform-net]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    # platform-net serves the site; desktop-net carries only noVNC streams to
    # Kali containers, which attach with a per-container DNS alias.
    networks: [platform-net, desktop-net]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}

networks:
  platform-net: {}
  desktop-net: {internal: true}
  database-net: {internal: true}
  lab-control-net: {internal: true}

volumes:
  postgres-data: {}
  redis-data: {}
