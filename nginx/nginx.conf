events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_sec_websocket_protocol $desktop_ticket {
        ~^(?:cyberlab-ticket,\s*|.*?,\s*)([^,]+).*$ $1;
        default "";
    }
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    server {
        listen 80;
        client_max_body_size 1025m;
        client_body_timeout 300s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ ^/api/lab-sessions/(?<desktop_session>[^/]+)/desktop$ {
            auth_request /_desktop_verify;
            auth_request_set $desktop_container $upstream_http_x_desktop_container;

            proxy_pass http://$desktop_container:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            resolver 127.0.0.11 valid=10s ipv6=off;
        }

        location = /_desktop_verify {
            internal;
            proxy_pass http://backend:8000/api/desktop/verify?identifier=$desktop_session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Desktop-Ticket $desktop_ticket;
            proxy_set_header X-Original-URI $request_uri;
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
